<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITO · AI 评分</title>
<style>
:root{--font:'Inter','PingFang SC','Microsoft YaHei',sans-serif;--gold:#c9a962;--gold-deep:#a8873f;--bg:#f7f5f0;--bg-card:#ffffff;--text:#1a1a18;--text-secondary:#6b6a66;--text-tertiary:#9a9a96;--border:#e9e4da;--radius:14px;--radius-sm:9px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:48px 56px;max-width:520px;width:calc(100% - 40px);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;color:#fff;letter-spacing:.5px}
h1{font-size:19px;font-weight:500;letter-spacing:2px;margin-bottom:4px}
.sub{font-size:12px;color:var(--text-tertiary);margin-bottom:28px}
.countdown{font-size:12px;color:var(--text-secondary);margin-bottom:22px}
.countdown b{color:var(--gold-deep);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 34px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;background:var(--gold);color:#fff;letter-spacing:1px;transition:opacity .15s;text-decoration:none}
.btn:hover{opacity:.9}
.links{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px}
.link-head{font-size:11px;color:var(--text-tertiary);letter-spacing:1px}
.link-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.link-chip{font-size:12px;color:var(--text-secondary);text-decoration:none;border:1px solid var(--border);border-radius:20px;padding:5px 14px;transition:all .15s}
.link-chip:hover{border-color:var(--gold);color:var(--gold-deep)}
.foot{margin-top:26px;font-size:10px;color:var(--text-tertiary)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">ITO</div>
  </div>
  <h1>AI 评分工作台</h1>
  <div class="sub">主播直播评分 · 评分系统 v4</div>
  <div class="countdown">正在进入工作台 <b id="sec">3</b>s…</div>
  <a class="btn" href="v4/">立即进入</a>
  <div class="links">
    <div class="link-head">其他系统</div>
    <div class="link-row">
      <a class="link-chip" href="exam0616.html">新品考试 0616</a>
      <a class="link-chip" href="agent-exam.html">AI Agent 培训考试</a>
      <a class="link-chip" href="v3/">主播评分 v3</a>
    </div>
  </div>
  <div class="foot">ITO · AI 评分工作台 v4.11</div>
</div>
<script>
(function(){
  var sec=3,el=document.getElementById('sec');
  var t=setInterval(function(){
    sec--;
    if(sec<=0){clearInterval(t);location.replace('v4/');}
    else el.textContent=sec;
  },1000);
})();
</script>
</body>
</html>
